# Catppuccin Frappe family (upstream: catppuccin/nvim).
# dark = frappe, light = latte (shared).

[family]
name = "catppuccin-frappe"
default_accent = "blue"

[ghostty]
dark = "catppuccin-frappe"
light = "catppuccin-latte"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "catppuccin-frappe"
dark_background = "dark"
light_colorscheme = "catppuccin-latte"
light_background = "light"

[opencode]
theme = "catppuccin"

# --- dark (frappe) ---
