# Catppuccin Latte family (upstream: catppuccin/nvim).
# Latte is light-only upstream, so dark = mocha (toggle-safe mirror).

[family]
name = "catppuccin-latte"
default_accent = "blue"

[ghostty]
dark = "catppuccin-mocha"
light = "catppuccin-latte"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "catppuccin-mocha"
dark_background = "dark"
light_colorscheme = "catppuccin-latte"
light_background = "light"

[opencode]
theme = "catppuccin"

