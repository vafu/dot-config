# Catppuccin Macchiato family (upstream: catppuccin/nvim).
# dark = macchiato, light = latte (shared).

[family]
name = "catppuccin-macchiato"
default_accent = "blue"

[ghostty]
dark = "catppuccin-macchiato"
light = "catppuccin-latte"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "catppuccin-macchiato"
dark_background = "dark"
light_colorscheme = "catppuccin-latte"
light_background = "light"

[opencode]
theme = "catppuccin"

# --- dark (macchiato) ---
[dark]
