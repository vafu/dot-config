# Everforest family (upstream: sainnhe/everforest, medium contrast).
# dark = dark medium, light = light medium (values approximate, eyeball check pending).

[family]
name = "everforest"
default_accent = "blue"

[ghostty]
dark = "everforest-dark"
light = "everforest-light"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "everforest"
dark_background = "dark"
light_colorscheme = "everforest"
light_background = "light"

[opencode]
theme = "everforest"

