# Gruvbox-material hard family (upstream: sainnhe/gruvbox-material).
# background=hard, foreground=material (defaults).

[family]
name = "gruvbox-material-hard"
default_accent = "blue"

[ghostty]
dark = "gruvbox-material-hard"
light = "gruvbox-material-hard-light"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "gruvbox-material"
dark_background = "dark"
dark_prelude = "vim.g.gruvbox_material_background = 'hard'"
light_colorscheme = "gruvbox-material"
light_background = "light"
light_prelude = "vim.g.gruvbox_material_background = 'hard'"

[opencode]
theme = "gruvbox"

