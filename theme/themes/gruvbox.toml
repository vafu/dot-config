# Gruvbox family (upstream: moretz/gruvbox, medium contrast).
# dark = dark medium, light = light medium.

[family]
name = "gruvbox"
default_accent = "blue"

[ghostty]
dark = "gruvbox-dark"
light = "gruvbox-light"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "gruvbox"
dark_background = "dark"
light_colorscheme = "gruvbox"
light_background = "light"

[opencode]
theme = "gruvbox"

