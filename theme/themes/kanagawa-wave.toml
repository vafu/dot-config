# Kanagawa-wave family (upstream: rebelot/kanagawa.nvim, default dark).
# dark = wave, light = lotus (shared with kanagawa.toml).
# Terminal ANSI mapping follows upstream wave term[] table.

[family]
name = "kanagawa-wave"
default_accent = "blue"

[ghostty]
dark = "kanagawa-wave"
light = "kanagawa-lotus"

[opencode]
theme = "kanagawa"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "kanagawa-wave"
dark_background = "dark"
light_colorscheme = "kanagawa-lotus"
light_background = "light"

# --- dark (wave) ---
[dark]
bg = "#1F1F28"
fg = "#DCD7BA"
cursor = "#C8C093"
