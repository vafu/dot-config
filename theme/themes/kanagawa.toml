# Kanagawa family (upstream: rebelot/kanagawa.nvim).
# dark  = dragon (late-night), light = lotus (daylight).
# Terminal ANSI mapping follows upstream term[] tables per variant.
# NOTE: no kanagawa GTK build exists, so [gsettings] intentionally keeps
# kanso-dark/kanso until an adw-gtk3 kanagawa variant is built.

[family]
name = "kanagawa"
default_accent = "blue"

[ghostty]
dark = "kanagawa-dragon"
light = "kanagawa-lotus"

[opencode]
theme = "kanagawa"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "kanagawa"
dark_background = "dark"
light_colorscheme = "kanagawa"
light_background = "light"

# --- dark (dragon) ---
[dark]
