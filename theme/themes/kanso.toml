# Kanso family: single source of truth for every surface.
# Usage: theme-set kanso <dark|light>. Surfaces read [dark]/[light] via
# pal_export (lib.sh) and render their native configs from templates.
# Ghostty theme names + gtk-theme names stay here so `theme-set <family>`
# needs no per-surface edits when a new family is added.

[family]
name = "kanso"
default_accent = "blue"

[ghostty]
dark = "kanso-ink"
light = "kanso-pearl"

[opencode]
theme = "system"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "kanso"
dark_background = "dark"
light_colorscheme = "kanso"
light_background = "light"

