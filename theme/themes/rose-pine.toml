# Rose Pine family (upstream: rose-pine/neovim).
# dark = main, light = dawn. Pine/foam share blue/aqua slots (palette has
# no distinct blue/orange, so foam covers both and rose covers orange).

[family]
name = "rose-pine"
default_accent = "blue"

[ghostty]
dark = "rose-pine"
light = "rose-pine-dawn"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "rose-pine"
dark_background = "dark"
light_colorscheme = "rose-pine-dawn"
light_background = "light"

[opencode]
theme = "system"

