# Tokyonight family (upstream: folke/tokyonight.nvim).
# dark = night, light = day (day values best-effort).

[family]
name = "tokyonight"
default_accent = "blue"

[ghostty]
dark = "tokyonight-night"
light = "tokyonight-day"

[gsettings]
color_scheme_dark = "prefer-dark"
color_scheme_light = "prefer-light"
gtk_theme_dark = "kanso-dark"
gtk_theme_light = "kanso"

[nvim]
dark_colorscheme = "tokyonight-night"
dark_background = "dark"
light_colorscheme = "tokyonight-day"
light_background = "light"

[opencode]
theme = "tokyonight"

# --- dark (night) ---
[dark]
